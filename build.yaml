# This file generates the GitHub Actions matrix.
# For simple board + shield combinations, add them to the top level board and
# shield arrays, for more control, add individual board + shield combinations
# to the `include` property. You can also use the `cmake-args` property to
# pass flags to the build command and `artifact-name` to assign a name to
# distinguish build outputs from each other:
#
# board: [ "nice_nano_v2" ]
# shield: [ "corne_left", "corne_right" ]
# include:
#   - board: bdn9_rev2
#   - board: nice_nano_v2
#     shield: reviung41
#   - board: nice_nano_v2
#     shield: corne_left
#     cmake-args: -DCONFIG_ZMK_USB_LOGGING=y
#     artifact-name: corne_left_with_logging
#
---
include:
  - board: seeeduino_xiao_ble
    shield: AroundForty-RB_R rgbled_adapter
    snippet: studio-rpc-usb-uart
  - board: seeeduino_xiao_ble
    shield: AroundForty-RB_L rgbled_adapter
  - board: seeeduino_xiao_ble
    shield: settings_reset
  # Separate opt-in image; the ordinary R/L builds above remain unchanged.
  - board: seeeduino_xiao_ble
    shield: AroundForty-RB_R rgbled_adapter
    snippet: studio-rpc-usb-uart
    artifact-name: AroundForty-RB_R-analytics-usb-poc
    # The reusable workflow copies only config/ to an isolated west workspace.
    # Load both modules and Analytics files from the original checkout.
    cmake-args: >-
      -DZMK_EXTRA_MODULES="${GITHUB_WORKSPACE};${GITHUB_WORKSPACE}/analytics"
      -DEXTRA_CONF_FILE="${GITHUB_WORKSPACE}/analytics/usb-poc.conf;${GITHUB_WORKSPACE}/analytics/persistence.conf"
      -DEXTRA_DTC_OVERLAY_FILE="${GITHUB_WORKSPACE}/analytics/usb-poc.overlay"
