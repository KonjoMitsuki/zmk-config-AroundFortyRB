# Explicit opt-in: unprotected diagnostic snapshot and explicit-save endpoint.
CONFIG_ZMK_ANALYTICS=y
CONFIG_ZMK_ANALYTICS_USB_POC=y
# Distinguish this image from the ordinary Studio-only firmware on the host.
CONFIG_USB_DEVICE_PRODUCT="AroundFortyRB Analytics PoC"
# HID, Studio CDC and Analytics CDC share the nRF USB driver's event pool.
# Exhaustion flushes pending events and reinitializes the USB controller.
CONFIG_USB_NRFX_EVT_QUEUE_SIZE=64
CONFIG_MEM_SLAB_TRACE_MAX_UTILIZATION=y
